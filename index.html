<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> męta męta</title>
	<style>
		.quiz { max-width: 560px; margin: 40px auto; padding: 24px; border: 2px solid #3a9d5d; border-radius: 12px; background: #f1fbf4; font-family: sans-serif; }
		.quiz h2 { text-align: center; color: #23774a; margin-top: 0; }
		.question { margin-bottom: 24px; }
		.question p { font-weight: bold; font-size: 1.15em; }
		.answers button { display: block; width: 100%; margin: 6px 0; padding: 10px 14px; font-size: 1em; text-align: left; border: 2px solid #3a9d5d; border-radius: 8px; background: #fff; cursor: pointer; }
		.answers button:hover:not(:disabled) { background: #dff3e6; }
		.answers button:disabled { cursor: default; }
		.answers button.correct { background: #b9ebc8; border-color: #1f8a46; }
		.answers button.wrong { background: #f7c4c4; border-color: #c0392b; }
		.feedback { min-height: 1.2em; font-weight: bold; }
		#result { text-align: center; font-size: 1.2em; font-weight: bold; }
		#save-form { display: none; text-align: center; margin-top: 16px; }
		#save-form input[type=text] { padding: 8px; font-size: 1em; border: 2px solid #3a9d5d; border-radius: 8px; width: 70%; }
		#save-form button { margin-top: 8px; padding: 10px 20px; font-size: 1em; border: none; border-radius: 8px; background: #23774a; color: #fff; cursor: pointer; }
		#save-status { font-weight: bold; margin-top: 8px; }
		.hidden { display: none; }
		#restart { display: none; margin: 12px auto 0; padding: 10px 20px; font-size: 1em; border: none; border-radius: 8px; background: #3a9d5d; color: #fff; cursor: pointer; }
	</style>
</head>
<body>
	<h1>WITAMY NA STRONIE męta męta   </h1>
	<h6>WYKORZYSTYWANIE PRAW AUTORSKIH ZABRONIONE </h6>
	<h3>ŻYCZĘ MIŁEGO KORZYSTANIA ZE STRONY:D</h3>

	<center>
		<img src="mienta.png" alt="Mięta">
		<br>
		<a href="https://prez.codingtree.pl/#starsi">google</a>
	</center>

	<section class="quiz">
		<h2>Quiz</h2>
		<div id="questions"></div>
		<div id="result"></div>
		<form id="save-form" name="quiz" method="POST" data-netlify="true" netlify-honeypot="bot-field">
			<p class="hidden"><label>Nie wypełniaj: <input name="bot-field"></label></p>
			<input type="text" name="imie" placeholder="Twoje imię" maxlength="60" required>
			<input type="hidden" name="pytanie1">
			<input type="hidden" name="pytanie2">
			<input type="hidden" name="wynik">
			<br>
			<button type="submit">Zapisz wynik</button>
			<div id="save-status"></div>
		</form>
		<button id="restart" type="button">Zagraj jeszcze raz</button>
	</section>

	<script>
		const quiz = [
			{
				question: "1. Czy w grze Spore Collection jest tryb wielosobowy?",
				answers: ["tak", "nie"],
				correct: 1
			},
			{
				question: "2. Ile jest odmian mięty?",
				answers: ["465", "298", "600+"],
				correct: 2
			}
		];

		const container = document.getElementById("questions");
		const result = document.getElementById("result");
		const restart = document.getElementById("restart");
		let score = 0;
		let answered = 0;
		let chosen = [];
		const saveForm = document.getElementById("save-form");
		const saveStatus = document.getElementById("save-status");

		saveForm.addEventListener("submit", (e) => {
			e.preventDefault();
			saveForm.pytanie1.value = chosen[0] || "";
			saveForm.pytanie2.value = chosen[1] || "";
			saveForm.wynik.value = score + " / " + quiz.length;
			const btn = saveForm.querySelector("button");
			btn.disabled = true;
			saveStatus.textContent = "Zapisywanie...";
			saveStatus.style.color = "#23774a";
			fetch("/", {
				method: "POST",
				headers: { "Content-Type": "application/x-www-form-urlencoded" },
				body: new URLSearchParams(new FormData(saveForm)).toString()
			})
				.then((res) => {
					if (!res.ok) throw new Error();
					saveStatus.textContent = "Wynik zapisany! Dziękujemy 😊";
				})
				.catch(() => {
					saveStatus.textContent = "Nie udało się zapisać. Spróbuj ponownie.";
					saveStatus.style.color = "#c0392b";
					btn.disabled = false;
				});
		});

		function render() {
			score = 0;
			answered = 0;
			chosen = [];
			saveForm.style.display = "none";
			saveForm.reset();
			saveStatus.textContent = "";
			saveForm.querySelector("button").disabled = false;
			container.innerHTML = "";
			result.textContent = "";
			restart.style.display = "none";

			quiz.forEach((q, qi) => {
				const block = document.createElement("div");
				block.className = "question";

				const text = document.createElement("p");
				text.textContent = q.question;
				block.appendChild(text);

				const answers = document.createElement("div");
				answers.className = "answers";
				const feedback = document.createElement("div");
				feedback.className = "feedback";

				q.answers.forEach((answer, i) => {
					const btn = document.createElement("button");
					btn.type = "button";
					btn.textContent = (i + 1) + ". " + answer;
					btn.addEventListener("click", () => {
						const buttons = answers.querySelectorAll("button");
						buttons.forEach((b) => (b.disabled = true));
						buttons[q.correct].classList.add("correct");
						chosen[qi] = answer;
						if (i === q.correct) {
							score++;
							feedback.textContent = "Dobrze! 🎉";
							feedback.style.color = "#1f8a46";
						} else {
							btn.classList.add("wrong");
							feedback.textContent = "Źle! Poprawna odpowiedź: " + q.answers[q.correct];
							feedback.style.color = "#c0392b";
						}
						answered++;
						if (answered === quiz.length) {
							result.textContent = "Twój wynik: " + score + " / " + quiz.length;
							restart.style.display = "block";
							saveForm.style.display = "block";
						}
					});
					answers.appendChild(btn);
				});

				block.appendChild(answers);
				block.appendChild(feedback);
				container.appendChild(block);
			});
		}

		restart.addEventListener("click", render);
		render();
	</script>
</body>
</html>
